<style>
:root{--c1:#721c45;--c2:#f47b2a;--ink:#23201f;--ln:#e4ddd6}*{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#ece7e1}
#app{display:grid;grid-template-columns:minmax(340px,440px) 1fr;height:100vh}
#ed{background:#fff;border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;flex-wrap:wrap;padding:8px 8px 0;border-bottom:1px solid var(--ln)}
#tabs button{border:0;background:none;padding:9px 10px;font:inherit;font-weight:600;color:#6d6560;border-bottom:3px solid transparent;cursor:pointer}
#tabs button.on{color:var(--c1);border-color:var(--c2)}
#pane{overflow:auto;padding:16px;flex:1}
label{display:block;font-size:12px;font-weight:600;color:#5d5550;margin:0 0 10px}
label.ck{display:flex;gap:8px;align-items:center}label.ck input{width:auto;margin:0}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:8px 9px;border:1px solid #cfc7bf;border-radius:7px;font:inherit;background:#fff;color:var(--ink)}
[hidden]{display:none!important}
input[type=color]{padding:2px;height:36px}textarea{resize:vertical}
:focus-visible{outline:3px solid #f2a46c;outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
h4{margin:18px 0 8px;font-size:13px;color:var(--c1)}h4:first-child{margin-top:0}
.b{border:1px solid #cfc7bf;background:#fff;border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.b:hover{background:#faf6f2}.b.p{background:var(--c1);border-color:var(--c1);color:#fff}.b.s{padding:4px 9px;font-size:12px}.b.d{color:#b3382c}
.card{border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:12px;background:#fcfaf8}
.row{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eee;color:#555}
.chip.Sent{background:#e1eefb;color:#1d5a99}.chip.Accepted{background:#e0f2e6;color:#1f6b3b}.chip.Expired,.chip.Cancelled,.chip.Rejected{background:#fbe5e1;color:#a53a2b}
.calc{background:#f6f1ec;border-radius:10px;padding:10px 12px;font-size:13px;margin:6px 0 12px}
.muted{color:#6d6560;font-size:12px}
#pv{overflow:auto;min-width:0}.bar{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;background:#ece7e1ee;border-bottom:1px solid var(--ln)}
#sheet{width:210mm;min-height:297mm;margin:14px auto 40px;background:#fff;position:relative;padding:0 14mm 6mm;box-shadow:0 4px 24px #0002;font-size:11.5px;line-height:1.55;overflow:hidden}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b2523;color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:20;max-width:90%}
.wm{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}.wm img{position:absolute;width:var(--ws,55%);transform:rotate(var(--wr,0deg))}
.wm.center img{left:50%;top:50%;transform:translate(-50%,-50%) rotate(var(--wr,0deg))}.wm.diagonal img{left:50%;top:50%;transform:translate(-50%,-50%) rotate(calc(var(--wr,0deg) - 35deg))}
.wm.topright img{width:calc(var(--ws,55%)*.5);right:4%;top:2%}.wm.bottomright img{width:calc(var(--ws,55%)*.5);right:4%;bottom:2%}.wm.tiled img{display:none}
.bd{position:relative;z-index:1}.hdr{margin:0 -14mm 6mm;padding:4mm 4mm 0;position:relative;z-index:1;background:#fff}.hdr .bn{width:100%;display:block}
.hdr .h2{display:flex;gap:14px;align-items:center;padding:12px 14mm;border-bottom:3px solid var(--c2)}.hdr .h2 img{height:46px}.hdr .h2 div{font-size:10.5px}
.ftr{margin:10mm -14mm -6mm;position:relative;z-index:1;background:#fff}.ftr .ft{font-size:7.5px;color:#6b625d;padding:1px 14mm 2px;text-align:center}.ftr img{width:100%;display:block}
table.pshell{width:100%;border-collapse:collapse;border:0;margin:0}table.pshell>thead>tr>td,table.pshell>tbody>tr>td,table.pshell>tfoot>tr>td{border:0;padding:0;background:none}
.ps-top,.ps-bot{display:none}
.ttl{background:var(--c1);color:#fff;border-radius:14px 28px;padding:10px 28px;margin:2px auto 14px;width:fit-content;min-width:68%;max-width:92%;text-align:center}.ttl small{display:block;opacity:.88;font-size:10.5px;letter-spacing:.4px}.ttl h1{margin:2px 0 0;font-size:20px;line-height:1.25;font-weight:600}
#sheet h2{position:relative;text-align:center;color:var(--c1);font-size:17px;font-weight:700;margin:16px 0 8px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px;break-after:avoid}
#sheet h3{font-size:12.5px;font-weight:700;margin:12px 0 4px;break-after:avoid;color:#1f1d1c}#sheet ul{margin:3px 0 6px;padding-left:22px;list-style-type:disc}#sheet li{margin:2px 0}
.bd table{width:100%;border-collapse:collapse;margin:6px 0 10px}.bd td,.bd th{border:1px solid #cfc7c2;padding:6px 9px;text-align:left;vertical-align:top}
.bd th{background:var(--c1);color:#fff;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}.bd td.k{font-weight:700;width:30%;background:#faf6f3}
[data-sec="price"] table{width:76%;margin:6px auto 12px}[data-sec="stay"] table{width:92%;margin:6px auto 12px}[data-sec="stay"] th,[data-sec="stay"] td{text-align:center}
.bd tr,.day,[data-sec="price"],[data-sec="stay"],[data-sec="bank"],.wcu{break-inside:avoid}.tot td{font-weight:700;background:#fdf1e8}.ov{font-weight:600;color:var(--c1);margin:3px 0}.nt{font-style:italic;margin:2px 0}
.wcu{text-align:center;margin-top:20px;padding-top:10px}.wcu-h{color:var(--c1);font-size:21px;font-weight:700;letter-spacing:.3px;margin:6px 0 4px;text-transform:uppercase}.wcu-s{color:var(--c2);font-size:16px;font-weight:700;margin:0 0 14px}
.wcu-pts{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;text-align:left;margin:0 auto 18px;font-size:11px;list-style:none!important;padding:0!important}.wcu-pts li{position:relative;padding-left:15px;margin:2px 0!important}.wcu-pts li::before{content:"";position:absolute;left:1px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--c2)}
.wcu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:0 auto;max-width:94%}.wcu-card{display:flex;align-items:center;gap:10px;border:1.5px solid var(--c2);border-radius:8px;padding:8px 10px;text-align:left;background:#fff}
.wcu-ic{width:36px;height:36px;border-radius:6px;background:var(--c2);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}.wcu-ic svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wcu-l{font-size:10.5px;font-weight:600;color:#23201f;line-height:1.25}.wcu-v{font-size:13px;font-weight:700;color:var(--c2);line-height:1.25}
#wn{margin:8px 12px 0;font-size:12px;color:#a53a2b}[data-e]:hover,[data-el]:hover{background:#fff7ec;outline:1px dashed #f2a46c}td.req{outline:2px dashed #d9534f;outline-offset:-2px}td.req:empty::after{content:"Required";color:#d9534f}
.hb{position:absolute;right:0;top:1px;font-size:10px;border:1px solid #cfc7bf;background:#fff;border-radius:6px;cursor:pointer;opacity:0;color:#555;padding:2px 7px;text-decoration:none}#sheet h2:hover .hb{opacity:1}
dialog{border:1px solid var(--ln);border-radius:12px;max-width:640px;width:92%}#gl{max-height:55vh;overflow:auto}.gi{border-bottom:1px solid var(--ln);padding:8px 0;font-size:13px;align-items:flex-start}.gi del{color:#a53a2b}.gi ins{color:#1f6b3b;text-decoration:none;font-weight:600}
@media(max-width:900px){#app{display:block;height:auto}#pane{overflow:visible}#ed{border:0}}
@page{size:A4;margin:0}
@media print{body{background:#fff}#ed,.bar,#toast,#wn,dialog,#file,#cloudbar,.ag-box,.hb{display:none!important}#app{display:block;height:auto}#pv{overflow:visible}
#sheet{zoom:1!important;width:210mm;min-height:0;margin:0;padding:0;box-shadow:none;overflow:visible}
.wm{position:fixed;top:0;left:0;width:210mm;height:297mm;z-index:0}.hdr{position:fixed;top:0;left:0;width:210mm;margin:0;padding:4mm 4mm 0;background:#fff;z-index:10}.ftr{position:fixed;bottom:0;left:0;width:210mm;margin:0;background:#fff;z-index:10}
table.pshell>thead{display:table-header-group}table.pshell>tfoot{display:table-footer-group}
.ps-top{display:block;height:31mm}.ps-bot{display:block;height:28mm}.ps-mid{padding:0 14mm!important}
.wcu{break-before:page;padding-top:34mm}
tr.empty-req{display:none!important}td.req{outline:0!important}td.req:empty::after{content:""!important}[data-e],[data-el]{outline:0!important;background:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
